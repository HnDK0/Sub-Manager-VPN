name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Allow the workflow to publish a GitHub Release (binary built here, not
# committed into the repo).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build static linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o submanager-linux .

      # Publish the binary as a GitHub Release (tag "latest") so users install it
      # with a one-line curl|bash — no binary committed into git history.
      - name: Publish binary to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest --title "latest" --latest submanager-linux 2>/dev/null \
            || gh release upload latest submanager-linux --clobber
